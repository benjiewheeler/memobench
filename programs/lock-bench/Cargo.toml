[package]
name = "lock-bench"
version = "2.0.0"
description = "Solana RPC performance benchmark with write locks"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "lock_bench"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.29.0"
solana-program = "1.16.24"
